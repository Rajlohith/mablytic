<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta
      name="robots"
      content="noindex,nofollow,noarchive,nosnippet,noimageindex,nocache,max-snippet:0,max-image-preview:none,max-video-preview:-1"
    />
    <title>MABlytic — Login</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0d1017" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">M</div>
        <span class="logo-name">MABlytic</span>
      </div>

      <!-- Role tabs -->
      <div class="role-tabs">
        <button class="role-tab active" id="tab-user" onclick="setRole('user')">
          👤 User
        </button>
        <button class="role-tab" id="tab-admin" onclick="setRole('admin')">
          🛡 Admin
        </button>
      </div>

      <!-- Error -->
      <div class="err-msg" id="err"></div>

      <!-- Form -->
      <div class="form-group">
        <label>Username</label>
        <input
          type="text"
          id="username"
          placeholder="Enter username"
          autocomplete="username"
        />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter password"
          autocomplete="current-password"
          onkeydown="if (event.key === 'Enter') doLogin();"
        />
      </div>

      <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
        Login
      </button>

      <div class="footer-link">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
